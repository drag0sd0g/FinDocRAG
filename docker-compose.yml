# ============================================================
# FinDocDRAG — Full Local Stack
# Usage: docker compose up
# See: docs/technical-design-document.md Section 10.2
# ============================================================

services:

  # ── PostgreSQL + pgvector ──────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: findoc-postgres
    environment:
      POSTGRES_DB: findocdrag
      POSTGRES_USER: findocdrag
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - work_mem=256MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - effective_cache_size=4GB
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findocdrag -d findocdrag"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Database migrations ────────────────────────────────────
  db-migrate:
    image: pgvector/pgvector:pg16
    container_name: findoc-db-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: findocdrag
      PGUSER: findocdrag
      PGPASSWORD: changeme
    volumes:
      - ./db/migrations:/migrations:ro
    entrypoint: >
      sh -c '
        echo "Running migrations...";
        for f in /migrations/*.sql; do
          echo "Applying $$f";
          psql -f "$$f";
        done;
        echo "Migrations complete.";
      '
    restart: "no"

  # ── Apache Kafka (KRaft mode — no Zookeeper) ──────────────
  kafka:
    image: apache/kafka:latest
    container_name: findoc-kafka
    environment:
      # KRaft mode (no Zookeeper)
      KAFKA_NODE_ID: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Auto-create topics
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "6"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_LOG_RETENTION_HOURS: "168"
      # Required for KRaft
      CLUSTER_ID: "findoc-rag-kafka-cluster-01"
      KAFKA_MESSAGE_MAX_BYTES: "157286400"
      KAFKA_REPLICA_FETCH_MAX_BYTES: "157286400"
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kafka topic setup (idempotent) ───────────────────────
  kafka-setup:
    image: apache/kafka:latest
    container_name: findoc-kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      sh -c '
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic filings.embedded \
          --partitions 6 \
          --replication-factor 1 \
          --config retention.ms=604800000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic filings.dlq \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=2592000000
      '
    restart: "no"

  # ── Ollama (LLM server) ───────────────────────────────────
  # Only started when the "local-llm" profile is active:
  #   docker compose --profile local-llm up -d
  # Omit the profile flag (or set LLM_BACKEND=claude/openai) to skip Ollama entirely.
  ollama:
    profiles: [local-llm]
    image: ollama/ollama:latest
    container_name: findoc-ollama
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 16G
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  # Pull the model after Ollama is healthy
  ollama-pull:
    profiles: [local-llm]
    image: curlimages/curl:latest
    container_name: findoc-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c '
        echo "Pulling model ${OLLAMA_MODEL:-mistral:7b}...";
        curl -sf http://ollama:11434/api/pull -d "{\"name\": \"${OLLAMA_MODEL:-mistral:7b}\"}" || true;
        echo "Model pull complete.";
      '
    restart: "no"

  # ── Ingestion Service ─────────────────────────────────────
  ingestion:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    container_name: findoc-ingestion
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: findocdrag
      POSTGRES_USER: findocdrag
      POSTGRES_PASSWORD: changeme
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EDGAR_USER_AGENT: "${EDGAR_USER_AGENT:-FinDocDRAG findocdrag@example.com}"
      EDGAR_RATE_LIMIT_RPS: "10"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    ports:
      - "8001:8001"
    volumes:
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Embedding Worker ──────────────────────────────────────
  embedding-worker:
    build:
      context: ./services/embedding-worker
      dockerfile: Dockerfile
    container_name: findoc-embedding-worker
    deploy:
      resources:
        limits:
          cpus: "12.0"
          memory: 16G
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: findocdrag
      POSTGRES_USER: findocdrag
      POSTGRES_PASSWORD: changeme
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-64}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s  # model download may take time

  # ── Query API ─────────────────────────────────────────────
  query-api:
    build:
      context: ./services/query-api
      dockerfile: Dockerfile
    container_name: findoc-query-api
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: findocdrag
      POSTGRES_USER: findocdrag
      POSTGRES_PASSWORD: changeme
      LLM_BACKEND: "${LLM_BACKEND:-ollama}"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-mistral:7b}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      CLAUDE_MODEL: "${CLAUDE_MODEL:-claude-opus-4-6}"
      EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
      API_KEYS: "${API_KEYS:-dev-key-1,dev-key-2}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s  # model download may take time

  # ── Prometheus ───────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: findoc-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Grafana ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: findoc-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  kafkadata:
  ollama_models:
  prometheus_data:
